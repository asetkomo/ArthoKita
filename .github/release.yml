# Categories for GitHub's "Generate release notes" button (fallback when a
# release is created by hand). release-please writes its own notes from
# Conventional Commits; this file only applies to manual releases.
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - github-actions[bot]
  categories:
    - title: Features
      labels: [enhancement, feature]
    - title: Bug Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other Changes
      labels: ["*"]
